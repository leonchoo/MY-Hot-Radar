<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人工发现 · MY Hot Radar · Newsroom</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/human_tips.css">
</head>
<body>
  <header class="newsroom-header">
    <h1>MY HOT RADAR · NEWSROOM</h1>
    <div class="subtitle">人工发现 / Human Tips · 彪哥的手动新闻线索</div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="/">&larr; 返回 Topic 列表</a>
    </div>

    <section class="stats" id="stats">
      <!-- populated by JS -->
    </section>

    <section class="tip-toolbar">
      <span class="toolbar-title">筛选:</span>
      <span class="filter-chip active" data-status="ALL">全部</span>
      <span class="filter-chip" data-status="OPEN">OPEN</span>
      <span class="filter-chip" data-status="ACKNOWLEDGED">ACKNOWLEDGED</span>
      <span class="filter-chip" data-status="INVESTIGATING">INVESTIGATING</span>
      <span class="filter-chip" data-status="LINKED">LINKED</span>
      <span class="filter-chip" data-status="RESOLVED">RESOLVED</span>
      <span class="toolbar-spacer"></span>
      <button id="b-new-tip" class="btn-primary" type="button">📝 我要报料</button>
    </section>

    <!-- Create form panel (hidden by default) -->
    <section id="create-panel" class="create-panel" hidden>
      <h2>📝 提交人工发现</h2>
      <p class="hint">彪哥手动发现一条新闻,交给 Radar 验证。Radar 将创建或匹配一个 Topic。</p>

      <form id="tip-form" class="tip-form" autocomplete="off">
        <div class="form-row">
          <label for="f-title">标题 <span class="required">*</span></label>
          <input id="f-title" name="title" type="text" maxlength="200" required
                 placeholder="例:柔佛烟霾情况恶化">
          <span class="field-error" id="err-title"></span>
        </div>

        <div class="form-row">
          <label for="f-description">新闻描述</label>
          <textarea id="f-description" name="description" rows="3" maxlength="2000"
                    placeholder="今天发现多个来源都在讨论柔佛烟霾情况,建议 Radar 检查。"></textarea>
        </div>

        <div class="form-row">
          <label for="f-source-url">原始来源链接 <span class="optional">(可选)</span></label>
          <input id="f-source-url" name="source_url" type="url" maxlength="500"
                 placeholder="https://example.com/news">
        </div>

        <div class="form-row">
          <label for="f-evidence">证据链接 <span class="optional">(可选,逗号分隔)</span></label>
          <input id="f-evidence" name="evidence_urls" type="text" maxlength="2000"
                 placeholder="https://example.com/shot1.png, https://example.com/shot2.png">
          <span class="field-hint">截图/照片/补充 URL</span>
        </div>

        <div class="form-row form-row-inline">
          <div class="form-col">
            <label for="f-priority">优先级</label>
            <select id="f-priority" name="priority">
              <option value="LOW">LOW · 低</option>
              <option value="MEDIUM" selected>MEDIUM · 中</option>
              <option value="HIGH">HIGH · 高</option>
              <option value="URGENT">URGENT · 紧急</option>
            </select>
          </div>
          <div class="form-col">
            <label for="f-target-agent">目标 Agent</label>
            <select id="f-target-agent" name="target_agent">
              <option value="radar" selected>radar · Radar 验证</option>
              <option value="default">default · Default 编辑审核</option>
            </select>
          </div>
          <div class="form-col">
            <label for="f-tags">标签 <span class="optional">(可选,逗号分隔)</span></label>
            <input id="f-tags" name="tags" type="text" maxlength="200"
                   placeholder="johor, jerebu">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="b-submit-tip" class="btn-primary">提交给 Radar</button>
          <button type="button" id="b-cancel" class="btn-secondary">取消</button>
        </div>

        <div id="form-error" class="form-error" hidden></div>
        <div id="form-success" class="form-success" hidden></div>
      </form>
    </section>

    <div id="tip-list">
      <div class="empty-tip">加载中...</div>
    </div>
  </div>

  <script src="/static/format.js"></script>
  <script src="/static/human_tips.js"></script>
</body>
</html>
