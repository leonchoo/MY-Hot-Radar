<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MY Hot Radar — Malaysia's Trending Radar">
  <title>MY Hot Radar — Malaysia's Trending Radar</title>

  <!-- Background: pure brand black -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle radar grid rings in the upper right -->
  <g opacity="0.08" fill="none" stroke="#ffffff" stroke-width="1">
    <circle cx="980" cy="160" r="200"/>
    <circle cx="980" cy="160" r="150"/>
    <circle cx="980" cy="160" r="100"/>
    <circle cx="980" cy="160" r="50"/>
  </g>

  <!-- Radar sweep hint (red arc) -->
  <g opacity="0.55">
    <path d="M 980 160 L 1130 100 A 200 200 0 0 0 1100 60 Z" fill="#e11d2a"/>
  </g>
  <circle cx="980" cy="160" r="6" fill="#e11d2a"/>

  <!-- Top-left red accent bar -->
  <rect x="60" y="140" width="64" height="6" fill="#e11d2a"/>

  <!-- Brand mark (simplified radar dot composite, matching logo-mark.svg) -->
  <g transform="translate(60,170)">
    <circle cx="30" cy="30" r="28" fill="#0a0a0a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="30" cy="30" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="30" cy="30" r="3" fill="#ffffff"/>
    <circle cx="30" cy="30" r="8" fill="#e11d2a"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(140,160)">
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      MY<tspan fill="#e11d2a"> Hot</tspan> Radar
    </text>
  </g>

  <!-- Tagline -->
  <text x="60" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="500" fill="#ffffff" opacity="0.92">
    Malaysia's Trending Radar
  </text>

  <!-- Sub-tagline -->
  <text x="60" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#ffffff" opacity="0.65">
    Surfacing what is heating up now —
  </text>
  <text x="60" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#ffffff" opacity="0.65">
    not just what happened today.
  </text>

  <!-- Bottom: domain + MVP badge -->
  <text x="60" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="600" fill="#ffffff" opacity="0.85">
    myhotradar.com
  </text>

  <!-- MVP pill (right side) -->
  <g transform="translate(960,520)">
    <rect width="180" height="44" rx="22" fill="none" stroke="#e11d2a" stroke-width="2"/>
    <text x="90" y="29" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="18" font-weight="700" fill="#e11d2a" letter-spacing="1">
      MVP · DEMO
    </text>
  </g>

  <!-- Bottom-right decorative radar dots -->
  <g opacity="0.4">
    <circle cx="1140" cy="560" r="3" fill="#e11d2a"/>
    <circle cx="1110" cy="560" r="3" fill="#e11d2a" opacity="0.6"/>
    <circle cx="1080" cy="560" r="3" fill="#e11d2a" opacity="0.3"/>
  </g>
</svg>
